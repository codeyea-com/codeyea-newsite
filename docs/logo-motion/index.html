<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CODEYEA / Logo motion</title><style>
@font-face{font-family:Josefin;src:url(../whmcs-review/assets/josefin-400.woff2);font-weight:400;font-display:swap}*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#072448;font-family:Josefin,Arial,sans-serif}header{display:flex;justify-content:space-between;gap:20px;padding:26px 5%;font-size:13px;border-bottom:1px solid #dbe2e8}header span{color:#617080}main{max-width:1100px;margin:40px auto;padding:0 24px}.stage{background:white;min-height:220px;display:grid;place-items:center;border:1px solid #dbe2e8;transition:background .3s}.stage.dark{background:#072448}object{display:block;width:min(100%,1000px);aspect-ratio:1255/276;pointer-events:none}.controls{display:flex;justify-content:space-between;gap:25px;align-items:center;padding-top:25px}.buttons{display:flex;gap:12px;flex-wrap:wrap}button{font:inherit;font-size:14px;cursor:pointer;border:1px solid #ccd6df;padding:14px 22px;background:white;color:#072448;border-radius:0;transition:color .2s,background .2s}button.primary{background:#072448;color:white;border-color:#072448}button:hover{background:#ed0845;color:white;border-color:#ed0845}button:focus-visible,a:focus-visible{outline:2px solid #10aabc;outline-offset:4px}p{font-size:14px;color:#617080;margin:0;line-height:1.6}.caption{margin-top:26px;border-top:1px solid #dbe2e8;padding-top:18px;display:flex;justify-content:space-between;gap:20px;font-size:13px}.caption a{color:#072448;text-decoration:none;border-bottom:1px solid #10aabc}@media(max-width:600px){header{display:block}header span{display:block;margin-top:10px}main{margin:25px auto;padding:0 16px}.stage{min-height:130px}.controls,.caption{align-items:start;flex-direction:column}.buttons{gap:8px}button{padding:13px 15px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><strong>CODEYEA / LOGO MOTION</strong><span>Original colours. Individual triangles. One complete mark.</span></header><main><div class="stage" id="stage"><object id="logo" data="codeyea-lockup-dark.svg" type="image/svg+xml" aria-label="Animated CODEYEA logo">Animated CODEYEA icon</object></div><div class="controls"><div class="buttons"><button class="primary" id="replay">Replay animation ↻</button><button id="pause" aria-pressed="false">Pause</button><button id="background" aria-pressed="false">Dark background</button></div><p id="status" role="status">Flicker → assemble → hold · repeats every 30 seconds</p></div><div class="caption"><span>Full logo · 16 triangles · Repeats every 30 seconds</span><a href="codeyea-lockup-dark.svg" download>Download animated SVG ↓</a></div></main><script>
const logo=document.getElementById('logo'),pause=document.getElementById('pause'),status=document.getElementById('status');let paused=false;
function root(){try{return logo.contentDocument?.documentElement}catch{return null}}
document.getElementById('replay').onclick=()=>{const svg=root();if(svg?.setCurrentTime){svg.setCurrentTime(0);svg.unpauseAnimations()}else{logo.data='codeyea-lockup-dark.svg?replay='+Date.now()}paused=false;pause.textContent='Pause';pause.setAttribute('aria-pressed','false');status.textContent='Flicker → assemble → hold · repeats every 30 seconds'};
pause.onclick=()=>{const svg=root();if(!svg?.pauseAnimations){status.textContent='Open the SVG directly to control playback in your browser.';return}paused=!paused;paused?svg.pauseAnimations():svg.unpauseAnimations();pause.textContent=paused?'Resume':'Pause';pause.setAttribute('aria-pressed',String(paused));status.textContent=paused?'Animation paused.':'Flicker → assemble → hold · repeats every 30 seconds'};
document.getElementById('background').onclick=e=>{const dark=document.getElementById('stage').classList.toggle('dark');e.currentTarget.textContent=dark?'Light background':'Dark background';e.currentTarget.setAttribute('aria-pressed',String(dark));logo.data=dark?'codeyea-lockup-light.svg':'codeyea-lockup-dark.svg';paused=false;pause.textContent='Pause';pause.setAttribute('aria-pressed','false')};
if(matchMedia('(prefers-reduced-motion:reduce)').matches){status.textContent='Reduced motion enabled — showing the completed icon.';pause.disabled=true}
</script></body></html>
