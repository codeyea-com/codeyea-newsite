<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مراجعة الهيرو الفاتح | CODEYEA</title><style>*{box-sizing:border-box;border-radius:0}body{margin:0;background:#f3f5f5;color:#172338;font:17px/1.7 Arial,sans-serif}main{max-width:1600px;margin:auto;padding:24px}h1{font-size:28px;margin:0 0 8px}p{margin:0 0 18px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}figure{margin:0}figcaption{font-weight:700;margin-bottom:8px}figure img{display:block;width:100%;height:auto;background:#fff;border:1px solid #dde3e4}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:22px 0}select,a{padding:10px 16px;font:inherit;border:1px solid #becbd0;background:#fff;color:#172338}a{background:#172338;color:#fff;text-decoration:none}.frame-shell{overflow:auto;background:#dde4e6;padding:16px}iframe{display:block;border:0;margin:auto;background:white;max-width:none;height:900px}.note{font-size:14px}@media(max-width:800px){.compare{grid-template-columns:1fr}main{padding:16px}}</style></head><body><main><h1>صور الهيرو الفاتحة وتداخل العنوان العربي</h1><p>صور جديدة بإضاءة وألوان فاتحة من المشهد نفسه. يبدأ الهيرو العربي داخل السطر الأخير من العنوان، مع بقاء الحركات وتكوين السكشن.</p><div class="compare"><figure><figcaption>مرجعك: موضع البداية عند الخط الأخضر</figcaption><img src="owner-reference.png" alt="مرجع المالك مع الخط الأخضر المحدد"></figure><figure><figcaption>التطبيق: بداية الصورة متداخلة مع العنوان</figcaption><img src="support-after.png" alt="الهيرو العربي بعد تعديل التداخل واستبدال الصورة"></figure></div><nav><label>الصفحة <select id="page"><option value="technical-support" data-group="service">الدعم التقني</option><option value="cloud-hosting" data-group="service">الاستضافة السحابية</option><option value="about" data-group="general">من نحن</option><option value="healthcare" data-group="industry">استقبال عيا eb-mobile-apps" data-group="service">web-mobile-apps</option><option value="website-hosting" data-group="service">website-hosting</option><option value="wordpress-hosting" data-group="service">wordpress-hosting</option><option value="email-hosting" data-group="service">email-hosting</option><option value="domains" data-group="service">domains</option></select></label><label>اللغة <select id="locale"><option value="ar">العربية</option><option value="en">English</option></select></label><label>الحجم <select id="size"><option value="1422">ديسكتوب</option><option value="820">تابلت</option><option value="390">موبايل</option></select></label><a id="open" target="_blank">فتح الصفحة كاملة</a></nav><p class="note">اختر الصفحة واللغة والحجم لمراجعة الصورة داخل الصفحة الفعلية. هذه معاينة محلية.</p><div class="frame-shell"><iframe id="preview" title="معاينة الهيرو"></iframe></div></main><script>const page=document.getElementById('page'),locale=document.getElementById('locale'),size=document.getElementById('size'),frame=document.getElementById('preview'),open=document.getElementById('open');function update(){const group=page.selectedOptions[0].dataset.group;const url=(group==='service'?'../application-concepts/':'')+page.value+'-'+locale.value+'.html';frame.src=url;frame.style.width=size.value+'px';open.href=url}page.onchange=locale.onchange=size.onchange=update;update();</script></body></html>
