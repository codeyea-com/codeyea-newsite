<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مراجعة مزامنة الرئيسية | CODEYEA</title><style>*{box-sizing:border-box;border-radius:0}body{margin:0;background:#e9edef;color:#10233e;font-family:Arial,sans-serif}header{padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:white}h1{font-size:20px;margin:0}select,a{padding:9px;color:inherit}main{padding:20px;overflow:auto}iframe{display:block;margin:auto;background:white;border:1px solid #d6dce3;max-width:100%;height:calc(100vh - 120px)}details{margin:24px;background:white;padding:20px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:20px}.comparison img{width:100%}figure{margin:16px 0}figcaption{padding:10px}p{line-height:1.7}</style></head><body><header><h1>مزامنة الرئيسية</h1><label>اللغة <select id="locale"><option value="ar">العربية</option><option value="en">English</option></select></label><label>الشاشة <select id="size"><option value="desktop">ديسكتوب</option><option value="mobile">موبايل</option></select></label><label>السكشن <select id="section"><option value="work">الكيس ستاديز</option><option value="industries">القطاعات</option><option value="services">الخدمات</option></select></label><a id="open" target="_blank">افتح المعاينة</a></header><main><iframe id="site" title="معاينة الرئيسية" width="1422"></iframe></main><details><summary>مقارنة القطاعات قبل وبعد</summary><p>نفس أبعاد الكروت وترتيب أول ثمانية قطاعات والحركة. أضيفت القطاعات الستة الناقصة، واستُخدمت صور الدليل الجديدة.</p><div class="comparison"><figure><img src="before-industries.jpg" alt="سلايدر القطاعات قبل المزامنة"><figcaption>قبل</figcaption></figure><figure><img src="after-industries.jpg" alt="سلايدر القطاعات بالصور الجديدة"><figcaption>بعد</figcaption></figure></div></details><script>const frame=document.getElementById('site'),locale=document.getElementById('locale'),size=document.getElementById('size'),section=document.getElementById('section'),open=document.getElementById('open');const params=new URLSearchParams(location.search);for(const [el,key] of [[locale,'locale'],[size,'size'],[section,'section']])if([...el.options].some(o=>o.value===params.get(key)))el.value=params.get(key);function update(){frame.style.width=(size.value==='mobile'?390:1422)+'px';frame.src=locale.value+'.html#'+section.value;open.href=frame.src;history.replaceState(null,'','?locale='+locale.value+'&size='+size.value+'&section='+section.value);}for(const el of [locale,size,section])el.addEventListener('change',update);update();</script></body></html>
