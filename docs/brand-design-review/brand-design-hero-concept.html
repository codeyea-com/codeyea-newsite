<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CODEYEA — Brand Design Hero Concept</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden}</style>
</head>
<body>
  <iframe id="brand-preview" title="Brand Design page preview" src="brand-design-interactive.html"></iframe>
  <script>
    const frame = document.getElementById('brand-preview');
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      const style = doc.createElement('link');
      style.rel = 'stylesheet';
      style.href = 'brand-design-hero-concept.css?v=11';
      doc.head.append(style);
      const script = doc.createElement('script');
      script.src = 'brand-design-hero-concept.js?v=11';
      doc.body.append(script);
    }, { once: true });
  </script>
</body>
</html>
