<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CODEYEA — Domain galaxy concept</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fff}
    iframe{display:block;width:100%;height:100vh;min-height:700px;border:0}
  </style>
</head>
<body>
  <iframe id="preview" src="domain-interactive.html" title="Domain page with galaxy hero concept"></iframe>
  <script>
    const frame=document.getElementById('preview');
    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc||doc.getElementById('domain-galaxy-style'))return;
      const style=doc.createElement('link');
      style.id='domain-galaxy-style';style.rel='stylesheet';style.href='domain-galaxy-concept.css?v=3';
      doc.head.append(style);
      const script=doc.createElement('script');script.src='domain-galaxy-concept.js?v=3';doc.body.append(script);
    });
  </script>
</body>
</html>
